# Theme "neon-candy": dark neon-glass surfaces with candy-pop gradients.
# Reload: Developer Tools -> Actions -> frontend.reload_themes
neon-candy:
  modes:
    dark:
      # surfaces
      primary-background-color: "#0d0f14"
      secondary-background-color: "#12151d"
      card-background-color: "#171a22"
      ha-card-background: "#171a22"
      ha-card-border-color: "#242835"
      ha-card-border-width: 1px
      ha-card-border-radius: 22px
      ha-card-box-shadow: "0 10px 30px rgba(0,0,0,.35)"
      divider-color: "#242835"
      # text
      primary-text-color: "#f3f4f8"
      secondary-text-color: "#8a90a3"
      text-primary-color: "#0b0c12"
      disabled-text-color: "#5a6075"
      primary-font-family: "Inter, -apple-system, system-ui, sans-serif"
      paper-font-body1_-_font-size: 14px
      # accents (Candy Pop)
      neon-orange: "#ff9f2e"
      neon-pink: "#ff4fa3"
      neon-lime: "#b5e21c"
      neon-cyan: "#3fe3ff"
      neon-purple: "#7b61ff"
      primary-color: "var(--neon-cyan)"
      accent-color: "var(--neon-pink)"
      light-primary-color: "#1fa8ff"
      dark-primary-color: "#0aa8e0"
      # state colors
      state-active-color: "var(--neon-orange)"
      state-icon-active-color: "var(--neon-orange)"
      state-icon-color: "#8a90a3"
      state-light-active-color: "var(--neon-orange)"
      state-media-player-active-color: "var(--neon-pink)"
      state-switch-active-color: "var(--neon-lime)"
      state-binary-sensor-active-color: "var(--neon-lime)"
      state-climate-cool-color: "var(--neon-cyan)"
      success-color: "var(--neon-lime)"
      warning-color: "var(--neon-orange)"
      error-color: "#fb5c7c"
      info-color: "var(--neon-cyan)"
      # sidebar (left rail)
      sidebar-background-color: "#0d0f14"
      sidebar-text-color: "#8a90a3"
      sidebar-icon-color: "#5a6075"
      sidebar-selected-icon-color: "var(--neon-cyan)"
      sidebar-selected-text-color: "#f3f4f8"
      # header
      app-header-background-color: "#0d0f14"
      app-header-text-color: "#f3f4f8"
      app-header-border-bottom: "1px solid #242835"
      # controls
      switch-checked-color: "var(--neon-lime)"
      switch-checked-button-color: "#ffffff"
      switch-checked-track-color: "var(--neon-lime)"
      switch-unchecked-button-color: "#ffffff"
      switch-unchecked-track-color: "#262a36"
      slider-color: "var(--neon-cyan)"
      slider-bar-color: "#262a36"
      paper-slider-knob-color: "var(--neon-cyan)"
      mdc-theme-primary: "var(--neon-cyan)"
      mdc-theme-surface: "#171a22"
      input-fill-color: "#20242f"
      input-ink-color: "#f3f4f8"
      input-label-ink-color: "#8a90a3"
      # popups
      ha-dialog-border-radius: 22px
      mdc-dialog-scrim-color: "rgba(0,0,0,.7)"
      # gradients used by button-card templates
      grad-orange: "linear-gradient(160deg,#ffb84d,#ff8a1e)"
      grad-cyan: "linear-gradient(160deg,#4fd7ff,#1fa8ff)"
      grad-pink: "linear-gradient(160deg,#ff5c8a,#ff2d6f)"
      grad-lime: "linear-gradient(160deg,#c6f04a,#8fc31f)"
      grad-purple: "linear-gradient(160deg,#9d7bff,#6a3dff)"
      grad-ring: "conic-gradient(from 210deg,#22e3a1,#3ec6ff 35%,#7b61ff 60%,#ff4f81 80%,#262a36 80%)"
      # surface tokens used inside card templates (keep dark/light in sync)
      nc-surface-2: "#1d2130"
      nc-track: "#262a36"
      nc-muted: "#8a90a3"
      nc-ink: "#f3f4f8"
      nc-dim: "#5a6075"
      nc-key: "#1d2130"
      nc-key-border: "#2a2f3e"
      nc-ring-face: "radial-gradient(circle at 40% 35%,#2a2f3d,#12141b 70%)"
      nc-ring-halo: "#12141b"
      nc-hero: "radial-gradient(120% 70% at 20% 0%,#ff1f8f44,transparent 60%),radial-gradient(80% 60% at 90% 10%,#00e5ff33,transparent),linear-gradient(180deg,#0b0d12,#1a1d27)"
      nc-pill-dark: "linear-gradient(160deg,#2a2f3e,#1d2130)"
      nc-pill-dark-ink: "#f3f4f8"
      nc-hero-ink: "#f3f4f8"
      nc-cta: "#13161ee6"
      nc-cta-ink: "#f3f4f8"
    light:
      # surfaces: soft off-white, glass cards, same candy accents
      primary-background-color: "#eef0f6"
      secondary-background-color: "#e6e9f1"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-color: "#e1e4ec"
      ha-card-border-width: 1px
      ha-card-border-radius: 22px
      ha-card-box-shadow: "0 10px 30px rgba(20,24,40,.08)"
      divider-color: "#e1e4ec"
      primary-text-color: "#14161e"
      secondary-text-color: "#6b7285"
      text-primary-color: "#ffffff"
      disabled-text-color: "#9aa1b3"
      primary-font-family: "Inter, -apple-system, system-ui, sans-serif"
      paper-font-body1_-_font-size: 14px
      neon-orange: "#ff8a1e"
      neon-pink: "#ff2d8a"
      neon-lime: "#7fb800"
      neon-cyan: "#0aa8e0"
      neon-purple: "#6a3dff"
      primary-color: "var(--neon-cyan)"
      accent-color: "var(--neon-pink)"
      light-primary-color: "#4fd7ff"
      dark-primary-color: "#0788b8"
      state-active-color: "var(--neon-orange)"
      state-icon-active-color: "var(--neon-orange)"
      state-icon-color: "#6b7285"
      state-light-active-color: "var(--neon-orange)"
      state-media-player-active-color: "var(--neon-pink)"
      state-switch-active-color: "var(--neon-lime)"
      state-binary-sensor-active-color: "var(--neon-lime)"
      state-climate-cool-color: "var(--neon-cyan)"
      success-color: "var(--neon-lime)"
      warning-color: "var(--neon-orange)"
      error-color: "#e0245e"
      info-color: "var(--neon-cyan)"
      sidebar-background-color: "#f6f7fb"
      sidebar-text-color: "#6b7285"
      sidebar-icon-color: "#9aa1b3"
      sidebar-selected-icon-color: "var(--neon-cyan)"
      sidebar-selected-text-color: "#14161e"
      app-header-background-color: "#eef0f6"
      app-header-text-color: "#14161e"
      app-header-border-bottom: "1px solid #e1e4ec"
      switch-checked-color: "var(--neon-lime)"
      switch-checked-button-color: "#ffffff"
      switch-checked-track-color: "var(--neon-lime)"
      switch-unchecked-button-color: "#ffffff"
      switch-unchecked-track-color: "#cfd4e0"
      slider-color: "var(--neon-cyan)"
      slider-bar-color: "#e1e4ec"
      paper-slider-knob-color: "var(--neon-cyan)"
      mdc-theme-primary: "var(--neon-cyan)"
      mdc-theme-surface: "#ffffff"
      input-fill-color: "#f1f3f8"
      input-ink-color: "#14161e"
      input-label-ink-color: "#6b7285"
      ha-dialog-border-radius: 22px
      mdc-dialog-scrim-color: "rgba(20,24,40,.45)"
      grad-orange: "linear-gradient(160deg,#ffb84d,#ff8a1e)"
      grad-cyan: "linear-gradient(160deg,#4fd7ff,#1fa8ff)"
      grad-pink: "linear-gradient(160deg,#ff5c8a,#ff2d6f)"
      grad-lime: "linear-gradient(160deg,#c6f04a,#8fc31f)"
      grad-purple: "linear-gradient(160deg,#9d7bff,#6a3dff)"
      grad-ring: "conic-gradient(from 210deg,#22e3a1,#3ec6ff 35%,#7b61ff 60%,#ff4f81 80%,#e1e4ec 80%)"
      nc-surface-2: "#f1f3f8"
      nc-track: "#e3e6ee"
      nc-muted: "#6b7285"
      nc-ink: "#14161e"
      nc-dim: "#9aa1b3"
      nc-key: "#f1f3f8"
      nc-key-border: "#dfe3ec"
      nc-ring-face: "radial-gradient(circle at 40% 35%,#ffffff,#e9ecf4 70%)"
      nc-ring-halo: "#f4f5f9"
      nc-hero: "radial-gradient(120% 70% at 20% 0%,#ff1f8f26,transparent 60%),radial-gradient(80% 60% at 90% 10%,#00c2ff26,transparent),linear-gradient(180deg,#ffffff,#f1f3f8)"
      nc-pill-dark: "linear-gradient(160deg,#2a2f3e,#1d2130)"
      nc-pill-dark-ink: "#ffffff"
      nc-hero-ink: "#14161e"
      nc-cta: "#0000000f"
      nc-cta-ink: "#14161e"
