# Copy the keys you need into /config/secrets.yaml and fill in your own values.
# Every value below is a placeholder. Never commit your real secrets.yaml.

# Webhook id that receives raw bank SMS ({"sender": ..., "text": ...}) from the phone (packages/finance.yaml).
finance_webhook_id: "replace-with-a-long-random-string-1"
# Webhook id spendparse posts parsed transactions back to (packages/finance.yaml).
finance_txn_webhook_id: "replace-with-a-long-random-string-2"
# Webhook id for quick food logging: POST {"calories":..,"protein":..,"carbs":..,"fat":..,"name":..} (packages/nutrition.yaml).
food_webhook_id: "replace-with-a-long-random-string-3"

# Shared token sent as the X-Token header to the spendparse service (packages/finance.yaml).
spendparse_token: "replace-with-your-spendparse-token"
# spendparse feed endpoint polled by sensor.spend_feed.
spendparse_feed_url: "http://192.168.1.50:8000/feed"   # example address: the host running spendparse
# spendparse endpoint that parses one SMS.
spendparse_sms_url: "http://192.168.1.50:8000/sms"   # example address
# spendparse endpoint that stores a manual transaction.
spendparse_txn_url: "http://192.168.1.50:8000/txn"   # example address
# spendparse endpoint that changes a transaction's category (HA renders {{ txn_id }}).
spendparse_category_url: "http://192.168.1.50:8000/txn/{{ txn_id }}/category"   # example address
# spendparse endpoint that marks a transaction as reimbursed (HA renders {{ txn_id }}).
spendparse_reimburse_url: "http://192.168.1.50:8000/txn/{{ txn_id }}/reimburse"   # example address

# One shell command: unlock the Mac login keychain, then start a Claude Code host (packages/mac.yaml).
# Uses the `mac` alias from /config/ssh/config; HA renders {{ folder }}, {{ name }} and {{ mode }}.
mac_claude_cmd: "ssh -F /config/ssh/config mac \"security unlock-keychain -p YOUR_MAC_PASSWORD ~/Library/Keychains/login.keychain-db && ~/bin/claude-rc.sh '{{ folder }}' '{{ name }}' '{{ mode }}'\""

# The Mac and Grab cards run SSH through two host aliases in /config/ssh/config, for example:
#   Host mac
#     HostName 192.168.1.40          # example address: your Mac
#     User you
#     IdentityFile /config/ssh/id_mac
#   Host nas
#     HostName 192.168.1.50          # example address: your NAS
#     User root
#     IdentityFile /config/ssh/id_ed25519
#   Host *
#     IdentitiesOnly yes
#     BatchMode yes
#     ConnectTimeout 10
#     UserKnownHostsFile /config/ssh/known_hosts
