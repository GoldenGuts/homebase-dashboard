# "Sky" view: sun path with live position, drifting clouds / rain, hourly strip, sun facts.
# Included from home.yaml. Data: sun.sun, weather.home (wraps Google Weather weather.home_2), sensor.forecast_hourly (packages/weather.yaml).
title: Sky
path: sky
icon: mdi:weather-sunset
type: custom:grid-layout
layout:
  grid-template-columns: minmax(0,1fr) minmax(0,1fr)
  grid-template-areas: |
    "sun sun"
    "hours hours"
    "facts daily"
  grid-gap: 18px
  padding: 18px 18px 96px
  align-items: start
  max_width: 1100px
  margin: 0 auto
  mediaquery:
    "(max-width: 800px)":
      grid-template-columns: minmax(0,1fr)
      grid-template-areas: |
        "sun" "hours" "facts" "daily"
      grid-gap: 12px
      padding: 12px 12px 96px
cards:

  # ================= SUN PATH =================
  - type: custom:button-card
    view_layout: { grid-area: sun }
    template: glass
    entity: sun.sun
    triggers_update: [weather.home]
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: more-info }
    styles:
      card: [ padding: 0, overflow: hidden ]
      grid: [ grid-template-areas: '"sky" "txt"', grid-template-columns: "minmax(0,1fr)" ]
      custom_fields:
        sky: [ width: 100% ]
        txt: [ width: 100%, text-align: left, padding: 14px 20px 18px, box-sizing: border-box ]
    custom_fields:
      sky: >
        [[[
          var a = entity ? entity.attributes : {}; var now = new Date();
          var T = (v) => v ? new Date(v) : null; var D = 86400000;
          var nr = T(a.next_rising), ns = T(a.next_setting); if (!nr || !ns) return '';
          var day = ns < nr;                                   // sun is up when the next event is a sunset
          var rise = day ? new Date(nr - D) : nr, set = day ? ns : new Date(ns - D);   // current cycle
          var f = day ? (now - rise) / (set - rise) : (now - set) / (rise - set);      // 0..1 along the arc
          f = Math.max(0, Math.min(1, f));
          var x = 60 + 880 * f, y = 220 - 170 * Math.sin(Math.PI * f);
          var L = 0, Lf = 0, px = 60, py = 220; for (var k = 1; k <= 200; k++) { var t = k / 200, qx = 60 + 880 * t, qy = 220 - 170 * Math.sin(Math.PI * t); L += Math.hypot(qx - px, qy - py); if (t <= f) Lf = L; px = qx; py = qy; } var lf = L ? Lf / L : f;
          var w = states['weather.home']; var c = w ? w.state : ''; var el = Number(a.elevation) || 0;
          var golden = day && el <= 12;
          var grad = !day ? ['#0b1026','#1b2350','#3a3f7a'] : golden ? ['#7b61ff','#ff7a59','#ffc36b'] : ['#3fa9ff','#8fd3ff','#dff3ff'];
          var ink = day && !golden ? '#0b2540' : '#ffffff';
          var clouds = { cloudy: 3, partlycloudy: 2, rainy: 2, pouring: 3, lightning: 2, 'lightning-rainy': 2, fog: 3, snowy: 2, hail: 2 }[c] || 0;
          var rain = ['rainy','pouring','lightning-rainy','hail'].includes(c), snow = c === 'snowy';
          var cloud = (cx, cy, s, dur, op) => '<g class="cl" style="animation-duration:' + dur + 's;opacity:' + op + '"><g transform="translate(' + cx + ' ' + cy + ') scale(' + s + ')">'
            + '<ellipse cx="0" cy="0" rx="46" ry="18"/><circle cx="-18" cy="-10" r="18"/><circle cx="8" cy="-16" r="22"/><circle cx="28" cy="-6" r="15"/>'
            + (rain ? '<g class="rain"><line x1="-24" y1="18" x2="-28" y2="34"/><line x1="-4" y1="20" x2="-8" y2="36"/><line x1="16" y1="18" x2="12" y2="34"/><line x1="34" y1="16" x2="30" y2="32"/></g>' : '')
            + (snow ? '<g class="snow"><circle cx="-20" cy="26" r="2.4"/><circle cx="2" cy="30" r="2.4"/><circle cx="24" cy="26" r="2.4"/></g>' : '') + '</g></g>';
          var cl = ''; var spots = [[250, 95, 1.15, 46, .95], [720, 75, .95, 60, .85], [500, 160, .7, 52, .7]];
          for (var i = 0; i < clouds; i++) cl += cloud(spots[i][0], spots[i][1], spots[i][2], spots[i][3], spots[i][4]);
          var stars = ''; if (!day) { var sd = 7; for (var i = 0; i < 40; i++) { sd = (sd * 9301 + 49297) % 233280; var sx = 20 + (sd / 233280) * 960; sd = (sd * 9301 + 49297) % 233280; var sy = 12 + (sd / 233280) * 170; stars += '<circle class="star" cx="' + sx.toFixed(0) + '" cy="' + sy.toFixed(0) + '" r="' + (1 + (i % 3) * .5) + '" style="animation-delay:' + (i * .37 % 4).toFixed(1) + 's"/>'; } }
          var fmt = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
          var body = day
            ? '<circle cx="' + x + '" cy="' + y + '" r="34" fill="url(#sung)" opacity=".55"/><circle cx="' + x + '" cy="' + y + '" r="15" fill="#fff4c2" stroke="#ffd166" stroke-width="3"/>'
            : '<circle cx="' + x + '" cy="' + y + '" r="26" fill="url(#moong)" opacity=".5"/><path d="M' + (x - 12) + ' ' + y + 'a12 12 0 1 0 24 0a9 9 0 1 1 -24 0z" fill="#f4f6ff"/>';
          return '<div class="skybox" style="background:linear-gradient(180deg,' + grad[0] + ',' + grad[1] + ' 60%,' + grad[2] + ')"><svg viewBox="0 0 1000 300" preserveAspectRatio="none">'
            + '<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + grad[0] + '"/><stop offset=".6" stop-color="' + grad[1] + '"/><stop offset="1" stop-color="' + grad[2] + '"/></linearGradient>'
            + '<radialGradient id="sung"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>'
            + '<radialGradient id="moong"><stop offset="0" stop-color="#cfd8ff"/><stop offset="1" stop-color="#cfd8ff" stop-opacity="0"/></radialGradient></defs>'
            + stars
            + '<path d="M60 220 A440 170 0 0 1 940 220" fill="none" stroke="' + ink + '" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 7"/>'
            + '<path d="M60 220 A440 170 0 0 1 940 220" fill="none" stroke="' + (day ? '#ffd166' : '#cfd8ff') + '" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="' + (lf * 100).toFixed(1) + ' 100"/>'
            + '<line x1="0" y1="220" x2="1000" y2="220" stroke="' + ink + '" stroke-opacity=".28" stroke-width="1"/>'
            + '<path d="M0 300 L0 250 Q120 232 250 246 T520 238 T760 250 T1000 240 L1000 300 Z" fill="' + ink + '" opacity=".14"/>'
            + body + cl
            + '</svg></div>';
        ]]]
      txt: >
        [[[
          var a = entity ? entity.attributes : {}; var now = new Date(); var T = (v) => v ? new Date(v) : null;
          var nr = T(a.next_rising), ns = T(a.next_setting); if (!nr || !ns) return '<div class="muted">No sun data</div>';
          var day = ns < nr; var nxt = day ? ns : nr; var ms = nxt - now; var hh = Math.floor(ms / 3600000), mm = Math.round((ms % 3600000) / 60000);
          var el = Number(a.elevation) || 0, az = Number(a.azimuth) || 0;
          var dir = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(az / 22.5) % 16];
          var w = states['weather.home']; var cond = w ? w.state.replace(/-/g, ' ') : '';
          var t = w ? Math.round(w.attributes.temperature) + '°' : '';
          var D = 86400000; var rise = day ? new Date(nr - D) : nr, set = day ? ns : new Date(ns - D); var fmt = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
          return '<div class="row between"><div><div class="mid">' + (day ? 'Sun sets in ' : 'Sun rises in ') + hh + 'h ' + mm + 'm</div>'
            + '<div class="muted" style="margin-top:3px">' + (day ? 'Elevation ' + el.toFixed(0) + '° · ' : 'Below the horizon · ') + 'azimuth ' + az.toFixed(0) + '° ' + dir + (cond ? ' · ' + cond + ' ' + t : '') + '</div></div>'
            + '<div class="times"><span class="pill"><ha-icon icon="mdi:weather-sunset-up" style="--mdc-icon-size:14px;color:#ff9f2e"></ha-icon>' + fmt(rise) + '</span><span class="pill"><ha-icon icon="mdi:weather-sunset-down" style="--mdc-icon-size:14px;color:#7b61ff"></ha-icon>' + fmt(set) + '</span><span class="pill">' + (day ? (el <= 12 ? '🌇 golden hour' : '☀️ daytime') : '🌙 night') + '</span></div></div>';
        ]]]
    extra_styles: |
      .tag { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--nc-muted); font-weight:700; }
      .mid { font-size:22px; font-weight:700; letter-spacing:-.5px; line-height:1.15; }
      .muted { color:var(--nc-muted); font-size:12px; }
      .row { display:flex; align-items:center; gap:12px; }
      .row.between > .muted { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .between { justify-content:space-between; }
      .grow { flex:1; min-width:0; }
      .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--nc-surface-2); color:var(--primary-text-color); white-space:nowrap; }
      ha-icon { margin:0; }
      svg { font-family: var(--primary-font-family); }
      .skybox { width:100%; line-height:0; }
      .skybox svg { display:block; width:100%; height:clamp(170px, 27vw, 330px); }
      .times { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
      .cl { fill:#ffffff; animation: drift linear infinite alternate; }
      .cl .rain line { stroke:#9fd4ff; stroke-width:2.5; stroke-linecap:round; animation: fall 1.1s linear infinite; }
      .cl .snow circle { fill:#ffffff; animation: fall 2.4s linear infinite; }
      .star { fill:#ffffff; animation: twinkle 3s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(28px); } }
      @keyframes fall { 0% { transform: translateY(0); opacity:1; } 100% { transform: translateY(14px); opacity:0; } }
      @keyframes twinkle { 0%, 100% { opacity:.35; } 50% { opacity:1; } }

  # ================= NEXT HOURS =================
  - type: custom:button-card
    view_layout: { grid-area: hours }
    template: glass
    entity: sensor.forecast_hourly
    show_icon: false
    show_name: false
    show_state: false
    styles:
      grid: [ grid-template-areas: '"h" "r"', grid-template-columns: "minmax(0,1fr)" ]
      custom_fields: { h: [ width: 100%, text-align: left ], r: [ width: 100%, min-width: 0 ] }
    custom_fields:
      h: '<div class="row between" style="margin-bottom:10px"><b style="font-size:14px">Next hours</b><span class="muted">temperature · rain chance</span></div>'
      r: >
        [[[
          var fc = (entity && entity.attributes.forecast) || [];
          if (!fc.length) return '<div class="muted">Waiting for the hourly forecast (sensor.forecast_hourly)…</div>';
          var mdi = (c, night) => night && c === 'partlycloudy' ? 'mdi:weather-night-partly-cloudy' : night && c === 'sunny' ? 'mdi:weather-night' : ({ 'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night','partlycloudy':'mdi:weather-partly-cloudy','cloudy':'mdi:weather-cloudy','rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','snowy':'mdi:weather-snowy','fog':'mdi:weather-fog','windy':'mdi:weather-windy','hail':'mdi:weather-hail' }[c] || 'mdi:weather-partly-cloudy');
          var tint = (c, night) => night && (c === 'partlycloudy' || c === 'sunny') ? '#9d7bff' : ({ 'sunny':'#ff9f2e','clear-night':'#9d7bff','rainy':'#3fe3ff','pouring':'#1fa8ff','lightning':'#9d7bff','lightning-rainy':'#9d7bff','cloudy':'#aab2c5','partlycloudy':'#ffd24d','snowy':'#cfe9ff','fog':'#aab2c5','windy':'#b5e21c' }[c] || '#ffd24d');
          var temps = fc.slice(0, 12).map(f => f.temperature); var lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
          return '<div class="hours">' + fc.slice(0, 12).map((f, i) => {
            var d = new Date(f.datetime); var hr = i === 0 ? 'Now' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }).replace(':00', '');
            var p = f.precipitation_probability || 0; var bar = hi > lo ? Math.round(100 * (f.temperature - lo) / (hi - lo)) : 50;
            return '<div class="hr"><div class="muted">' + hr + '</div><ha-icon icon="' + mdi(f.condition, f.is_daytime === false) + '" style="color:' + tint(f.condition, f.is_daytime === false) + '"></ha-icon>'
              + '<b>' + Math.round(f.temperature) + '°</b><span class="tb"><i style="height:' + (20 + bar * .5) + '%"></i></span>'
              + '<div class="pp' + (p >= 30 ? ' wet' : '') + '">' + (p ? p + '%' : '·') + '</div></div>'; }).join('') + '</div>';
        ]]]
    extra_styles: |
      .muted { color:var(--nc-muted); font-size:12px; }
      .row { display:flex; align-items:center; gap:12px; }
      .between { justify-content:space-between; }
      ha-icon { margin:0; }
      .hours { display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:4px; }
      .hr { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; min-width:0; }
      .hr ha-icon { --mdc-icon-size:22px; }
      .hr b { font-size:14px; }
      .tb { display:block; width:6px; height:44px; border-radius:999px; background:var(--nc-track); overflow:hidden; position:relative; }
      .tb i { position:absolute; bottom:0; left:0; right:0; border-radius:999px; background:linear-gradient(180deg,#ff9f2e,#ff4fa3); }
      .pp { font-size:10px; color:var(--nc-muted); }
      .pp.wet { color:#1fa8ff; font-weight:700; }
      @media (max-width: 800px) { .hours { grid-template-columns:repeat(6, minmax(0,1fr)); row-gap:14px; } }

  # ================= SUN FACTS: tiles =================
  - type: custom:button-card
    view_layout: { grid-area: facts }
    template: glass
    entity: sun.sun
    show_icon: false
    show_name: false
    show_state: false
    styles:
      grid: [ grid-template-areas: '"h" "t"', grid-template-columns: "minmax(0,1fr)" ]
      custom_fields: { h: [ width: 100%, text-align: left ], t: [ width: 100%, text-align: left ] }
    custom_fields:
      h: "[[[ return '<div class=\"row between\" style=\"margin-bottom:10px\"><b style=\"font-size:14px\">Sun today</b><span class=\"muted\">' + (hass.config.location_name || 'Home') + '</span></div>'; ]]]"
      t: >
        [[[
          var a = entity ? entity.attributes : {}; var T = (v) => v ? new Date(v) : null; var D = 86400000;
          var nr = T(a.next_rising), ns = T(a.next_setting), nd = T(a.next_dawn), nk = T(a.next_dusk), nn = T(a.next_noon);
          if (!nr || !ns) return '';
          var day = ns < nr; var rise = day ? new Date(nr - D) : nr, set = day ? ns : new Date(ns - D);
          var len = Math.abs(set - rise); var lh = Math.floor(len / 3600000), lm = Math.round((len % 3600000) / 60000);
          var fmt = (d) => d ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '—';
          var tile = (bg, ink, ico, val, lab) => '<div class="tt" style="background:' + bg + ';color:' + ink + '"><ha-icon icon="' + ico + '"></ha-icon><div class="tv">' + val + '</div><div class="tl">' + lab + '</div></div>';
          return '<div class="tiles">'
            + tile('var(--grad-purple)', '#ffffff', 'mdi:weather-sunset-up', fmt(nd), 'Dawn · first light')
            + tile('var(--grad-orange)', '#1b1206', 'mdi:weather-sunset-down', fmt(nk), 'Dusk · last light')
            + tile('var(--grad-cyan)', '#06131b', 'mdi:sun-clock', lh + 'h ' + lm + 'm', 'Daylight')
            + tile('var(--grad-lime)', '#12200a', 'mdi:white-balance-sunny', fmt(nn), 'Solar noon')
            + '</div>';
        ]]]
    extra_styles: |
      .muted { color:var(--nc-muted); font-size:12px; }
      .row { display:flex; align-items:center; gap:12px; }
      .between { justify-content:space-between; }
      ha-icon { margin:0; }
      .tiles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .tt { height:112px; border-radius:18px; padding:12px 14px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 10px 26px rgba(0,0,0,.28); min-width:0; }
      .tt ha-icon { --mdc-icon-size:26px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.18)); }
      .tt .tv { font-size:24px; font-weight:700; letter-spacing:-.8px; line-height:1; margin-top:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .tt .tl { font-size:11px; font-weight:600; opacity:.78; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  # ================= 5-DAY FORECAST =================
  - type: custom:button-card
    view_layout: { grid-area: daily }
    template: glass
    entity: sensor.forecast_daily
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: more-info, entity: weather.home }
    styles:
      grid: [ grid-template-areas: '"h" "r"', grid-template-columns: "minmax(0,1fr)" ]
      custom_fields: { h: [ width: 100%, text-align: left ], r: [ width: 100%, text-align: left ] }
    custom_fields:
      h: '<div class="row between" style="margin-bottom:6px"><b style="font-size:14px">Next days</b><span class="muted">high / low</span></div>'
      r: >
        [[[
          var fc = (entity && entity.attributes.forecast) || [];
          var cond = (c) => ({ 'sunny':'Sunny','clear-night':'Clear','partlycloudy':'Partly cloudy','cloudy':'Cloudy','rainy':'Rain','pouring':'Heavy rain','lightning':'Storm','lightning-rainy':'Storm','snowy':'Snow','fog':'Fog','windy':'Windy','hail':'Hail' }[c] || (c || '—'));
          var mdi = (c) => ({ 'sunny':'mdi:weather-sunny','clear-night':'mdi:weather-night','partlycloudy':'mdi:weather-partly-cloudy','cloudy':'mdi:weather-cloudy','rainy':'mdi:weather-rainy','pouring':'mdi:weather-pouring','lightning':'mdi:weather-lightning','lightning-rainy':'mdi:weather-lightning-rainy','snowy':'mdi:weather-snowy','fog':'mdi:weather-fog','windy':'mdi:weather-windy','hail':'mdi:weather-hail' }[c] || 'mdi:weather-partly-cloudy');
          var tint = (c) => ({ 'sunny':'#ff9f2e','clear-night':'#9d7bff','rainy':'#3fe3ff','pouring':'#1fa8ff','lightning':'#9d7bff','lightning-rainy':'#9d7bff','cloudy':'#aab2c5','partlycloudy':'#ffd24d','snowy':'#cfe9ff','fog':'#aab2c5','windy':'#b5e21c' }[c] || '#ffd24d');
          return fc.slice(0, 5).map((f, i) => { var d = new Date(f.datetime); var name = i === 0 ? 'Today' : d.toLocaleDateString('en-GB', { weekday: 'long' });
            return '<div class="frow"><span class="fi"><ha-icon icon="' + mdi(f.condition) + '" style="--mdc-icon-size:22px;color:' + tint(f.condition) + '"></ha-icon></span><div><div class="muted">' + name + '</div><b>' + cond(f.condition) + (f.precipitation_probability ? ' · ' + f.precipitation_probability + '%' : '') + '</b></div><div class="ft"><b>' + Math.round(f.temperature) + '°</b>/' + (f.templow !== undefined ? Math.round(f.templow) : '–') + '°</div></div>'; }).join('');
        ]]]
    extra_styles: |
      .muted { color:var(--nc-muted); font-size:12px; }
      .row { display:flex; align-items:center; gap:12px; }
      .between { justify-content:space-between; }
      ha-icon { margin:0; }
      .frow { display:flex; align-items:center; gap:10px; font-size:13px; margin:9px 0; }
      .frow .fi { width:26px; text-align:center; }
      .frow > div:nth-child(2) { flex:1; line-height:1.2; }
      .frow b { font-size:14px; }
      .ft { color:var(--nc-muted); font-size:13px; }
      .ft b { color:var(--primary-text-color); }
